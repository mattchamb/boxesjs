<?xml version='1.0' encoding='utf-8'?>
<svg height="70.20mm" viewBox="0.0 0.0 212.96 70.20" width="212.96mm" xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:svg="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<!--
Desksign - Simple diagonal plate with stands to show name or message.


Text to be engraved can be generated by inputting the label and fontsize
fields. height represents the area that can be used for writing text,
does not match the actual height when standing. Generated text is put
in the center and can be adjusted using the vertical text offset.
Empty lines will affect the placement.


Created with Boxes.py (https://boxes.hackerspace-bamberg.de/)
Command line (remove spaces between dashes): boxes Desksign - -width - -height - -angle - -label - -fontsize - -verticaltextoffset - -reference
-->
<title>Desksign</title>
<metadata>
<rdf:RDF><cc:Work>
<dc:title>Misc - Desksign</dc:title>
<dc:source>boxes Desksign --width 100 --height 50 --angle 45 --label Hi --fontsize 15 --verticaltextoffset 5 --labels 1 --reference 0</dc:source>
<dc:description>Simple diagonal plate with stands to show name or message.

Text to be engraved can be generated by inputting the label and fontsize
fields. height represents the area that can be used for writing text,
does not match the actual height when standing. Generated text is put
in the center and can be adjusted using the vertical text offset.
Empty lines will affect the placement.

Created with Boxes.py (https://boxes.hackerspace-bamberg.de/)
Command line: boxes Desksign --width 100 --height 50 --angle 45 --label Hi --fontsize 15 --verticaltextoffset 5 --labels 1 --reference 0
Command line short: boxes Desksign --width --height --angle --label --fontsize --verticaltextoffset --reference
</dc:description>
</cc:Work></rdf:RDF></metadata>
