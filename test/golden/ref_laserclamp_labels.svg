<svg height="98.70mm" viewBox="0.0 0.0 124.60 98.70" width="124.60mm" xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:svg="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<!--
LaserClamp - A clamp to hold down material to a knife table


You need a tension spring of the proper length to make the clamp work.
Increase extraheight to get more space for the spring and to make the
sliding mechanism less likely to bind. You may need to add some wax on the
parts sliding on each other to reduce friction.



Created with Boxes.py (https://boxes.hackerspace-bamberg.de/)
Command line (remove spaces between dashes): boxes LaserClamp - -extraheight - -reference
-->
<title>LaserClamp</title>
<metadata>
<rdf:RDF><cc:Work>
<dc:title>Misc - LaserClamp</dc:title>
<dc:source>boxes LaserClamp --extraheight 15 --thickness 3 --labels 1 --reference 0</dc:source>
<dc:description>A clamp to hold down material to a knife table

You need a tension spring of the proper length to make the clamp work.
Increase extraheight to get more space for the spring and to make the
sliding mechanism less likely to bind. You may need to add some wax on the
parts sliding on each other to reduce friction.


Created with Boxes.py (https://boxes.hackerspace-bamberg.de/)
Command line: boxes LaserClamp --extraheight 15 --thickness 3 --labels 1 --reference 0
Command line short: boxes LaserClamp --extraheight --reference
</dc:description>
</cc:Work></rdf:RDF></metadata>
