<svg height="153.42mm" viewBox="0.0 0.0 140.20 153.42" width="140.20mm" xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:svg="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<!--
SkadisBoard - Customizable Ikea like pegboard


Best cut from 5mm material to match the original. Use the included washers to mount. The board needs space towards the wall for hooks to go into.

You can use boxes and holders from the "WallMounted" group with "skadis" as "walltype". Note that these generators do not have any support to pick the right width(s). Inner distance between slots are 35 + n * 40 mm. It is recommended to cut the acceessories from 4 mm material. Then 36 + n * 40 mm should be used for inner widths. Deselect "outside" where available to be able to deal with inner measurements.


Created with Boxes.py (https://boxes.hackerspace-bamberg.de/)
Command line (remove spaces between dashes): boxes SkadisBoard - -columns - -rows - -reference - -labels
-->
<title>SkadisBoard</title>
<metadata>
<rdf:RDF><cc:Work>
<dc:title>WallMounted - SkadisBoard</dc:title>
<dc:source>boxes SkadisBoard --columns 5 --rows 4 --reference 0 --labels 0</dc:source>
<dc:description>Customizable Ikea like pegboard

Best cut from 5mm material to match the original. Use the included washers to mount. The board needs space towards the wall for hooks to go into.

You can use boxes and holders from the "WallMounted" group with "skadis" as "walltype". Note that these generators do not have any support to pick the right width(s). Inner distance between slots are 35 + n * 40 mm. It is recommended to cut the acceessories from 4 mm material. Then 36 + n * 40 mm should be used for inner widths. Deselect "outside" where available to be able to deal with inner measurements.

Created with Boxes.py (https://boxes.hackerspace-bamberg.de/)
Command line: boxes SkadisBoard --columns 5 --rows 4 --reference 0 --labels 0
Command line short: boxes SkadisBoard --columns --rows --reference --labels
</dc:description>
</cc:Work></rdf:RDF></metadata>
